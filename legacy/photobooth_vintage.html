<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Photo Booth - Analogue Edition</title>
    <style>
        :root {
            --bg-color: #121214;
            --panel-color: #1e1e24;
            --panel-border: #2d2d38;
            --accent-color: #ff4757;
            --text-color: #f1f2f6;
            --control-bg: #2a2a35;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin: 0 0 5px 0;
            font-weight: 800;
            background: linear-gradient(45deg, #f39c12, #ff4757);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #a4b0be;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .app-layout {
            display: flex;
            gap: 30px;
            max-width: 1100px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
        }

        @media (max-width: 900px) {
            .app-layout {
                flex-direction: column;
                align-items: center;
            }
        }

        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 500px;
        }

        .booth-card {
            background-color: var(--panel-color);
            border: 1px solid var(--panel-border);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        video.mirrored {
            transform: scaleX(-1);
        }

        .flash-overlay {
            position: absolute;
            inset: 0;
            background-color: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 5;
        }
        .flash-overlay.active { opacity: 1; }

        .countdown-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6rem;
            font-weight: 900;
            color: #fff;
            z-index: 4;
            display: none;
            background-color: rgba(0,0,0,0.3);
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #a4b0be;
            margin-bottom: 6px;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--control-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
            outline: none;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            padding: 12px 20px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .primary-btn { background-color: var(--accent-color); color: white; flex: 2; }
        .primary-btn:hover:not(:disabled) { background-color: #ff6b81; }
        .secondary-btn { background-color: #57606f; color: white; flex: 1; }

        button:disabled { opacity: 0.4; cursor: not-allowed; }

        .preview-pane {
            background-color: var(--panel-color);
            border: 1px solid var(--panel-border);
            padding: 25px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 260px;
        }

        .strip-wrapper {
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            padding: 16px 16px 28px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 180px;
            background-color: #f5f5f5;
            color: #222;
        }

        .frame-slot {
            width: 100%;
            aspect-ratio: 4/3;
            background-color: rgba(0,0,0,0.1);
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.15);
        }

        .frame-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .frame-slot.filled img { display: block; }

        .strip-caption {
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px dashed rgba(0,0,0,0.2);
        }

        .action-btn {
            margin-top: 20px;
            width: 100%;
            background-color: #2ed573;
            color: white;
            display: none;
        }
        .action-btn:hover { background-color: #26af5f; }

        #canvas-compiler { display: none; }
    </style>
</head>
<body>

    <h1>RETRO PHOTO BOOTH</h1>
    <div class="subtitle">Analogue Simulation: Film Grain & Vintage Light Leaks Included</div>

    <div class="app-layout">
        <div class="workspace">
            <div class="booth-card">
                <div class="video-container">
                    <div class="flash-overlay" id="flash"></div>
                    <div class="countdown-overlay" id="countdown">3</div>
                    <video id="preview-stream" autoplay playsinline class="mirrored"></video>
                </div>
                <div class="btn-row">
                    <button class="primary-btn" id="capture-trigger">START CAPTURE</button>
                    <button class="secondary-btn" id="cam-toggle">🔄 FLIP</button>
                </div>
            </div>

            <div class="booth-card">
                <div class="control-group">
                    <label>Base Look Style</label>
                    <select id="setting-filter">
                        <option value="bw">Classic Rich Silver B&W</option>
                        <option value="color">Warm Vintage 35mm Color</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Film Grain Intensity</label>
                    <select id="setting-grain">
                        <option value="light">Fine Grain (Subtle)</option>
                        <option value="medium" selected>Medium ISO 400 Texture</option>
                        <option value="heavy">Heavy ISO 1600 Coarse Grain</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Light Leak Degradation</label>
                    <select id="setting-leak">
                        <option value="none">None (Clean Negative)</option>
                        <option value="subtle">Subtle Side Flare</option>
                        <option value="dramatic" selected>Dramatic Retro Burn Flare</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Custom Base Caption</label>
                    <input type="text" id="setting-text" value="ANALOG MEMORIES" maxlength="32">
                </div>
            </div>
        </div>

        <div class="preview-pane">
            <label style="margin-bottom: 15px;">Strip Development Preview</label>
            <div class="strip-wrapper" id="render-strip"></div>
            <button class="action-btn" id="export-trigger">DOWNLOAD DIRECT IMAGE</button>
        </div>
    </div>

    <canvas id="canvas-compiler"></canvas>

    <script>
        const videoElement = document.getElementById('preview-stream');
        const triggerBtn = document.getElementById('capture-trigger');
        const camToggleBtn = document.getElementById('cam-toggle');
        const exportBtn = document.getElementById('export-trigger');
        const countdownOverlay = document.getElementById('countdown');
        const flashOverlay = document.getElementById('flash');
        const stripContainer = document.getElementById('render-strip');
        const canvasCompiler = document.getElementById('canvas-compiler');

        const filterSelect = document.getElementById('setting-filter');
        const grainSelect = document.getElementById('setting-grain');
        const leakSelect = document.getElementById('setting-leak');
        const textInput = document.getElementById('setting-text');

        let activeStream = null;
        let memoryCacheFrames = [];
        let currentFacingMode = "user"; 

        async function startCameraHardwareFeed() {
            if (activeStream) activeStream.getTracks().forEach(t => t.stop());
            try {
                activeStream = await navigator.mediaDevices.getUserMedia({
                    audio: false, video: { width: 1280, height: 960, facingMode: currentFacingMode }
                });
                videoElement.srcObject = activeStream;
            } catch (err) { alert("Error accessing camera input."); }
        }

        function structuralLayoutBlueprintRefresh() {
            stripContainer.innerHTML = '';
            for(let i = 0; i < 4; i++) {
                const slot = document.createElement('div');
                slot.className = 'frame-slot';
                slot.id = `slot-index-${i}`;
                const img = document.createElement('img');
                slot.appendChild(img);
                stripContainer.appendChild(slot);
            }
            const textStampNode = document.createElement('div');
            textStampNode.className = 'strip-caption';
            textStampNode.id = 'footer-text-node';
            textStampNode.innerHTML = `✨ ${textInput.value.toUpperCase()} ✨<br><span style="opacity:0.6; font-size:0.55rem;">EST. ${new Date().getFullYear()} // FILM</span>`;
            stripContainer.appendChild(textStampNode);
            exportBtn.style.display = 'none';
            memoryCacheFrames = [];
        }

        textInput.addEventListener('input', () => {
            const node = document.getElementById('footer-text-node');
            if(node) node.innerHTML = `✨ ${textInput.value.toUpperCase()} ✨<br><span style="opacity:0.6; font-size:0.55rem;">EST. ${new Date().getFullYear()} // FILM</span>`;
        });

        camToggleBtn.addEventListener('click', () => {
            currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
            videoElement.classList.toggle('mirrored');
            startCameraHardwareFeed();
        });

        async function runAutomationCaptureSequence() {
            triggerBtn.disabled = true;
            structuralLayoutBlueprintRefresh();

            for(let i = 0; i < 4; i++) {
                let count = 3;
                countdownOverlay.style.display = 'flex';
                countdownOverlay.textContent = count;
                while(count > 0) {
                    await new Promise(r => setTimeout(r, 1000));
                    count--;
                    if(count > 0) countdownOverlay.textContent = count;
                }
                countdownOverlay.style.display = 'none';
                flashOverlay.classList.add('active');
                setTimeout(() => flashOverlay.classList.remove('active'), 120);
                
                captureFrameMemorySlot(i);
                await new Promise(r => setTimeout(r, 600));
            }
            triggerBtn.disabled = false;
            exportBtn.style.display = 'block';
        }

        function captureFrameMemorySlot(idx) {
            const w = videoElement.videoWidth || 640;
            const h = videoElement.videoHeight || 480;
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            const ctx = c.getContext('2d');
            if(currentFacingMode === "user") {
                ctx.translate(w, 0); ctx.scale(-1, 1);
            }
            ctx.drawImage(videoElement, 0, 0, w, h);
            memoryCacheFrames[idx] = c;

            const slot = document.getElementById(`slot-index-${idx}`);
            const img = slot.querySelector('img');
            img.src = c.toDataURL('image/jpeg');
            slot.classList.add('filled');
        }

        // Processing compiler engine combining pixel adjustments, grain injection, and lighting burns
        function compileHighResBitmapDownload() {
            if (memoryCacheFrames.length < 4) return;

            const imgWidth = 600; const imgHeight = 450;
            const paddingSide = 30; const gapSpacing = 20; const layoutFooterZoneHeight = 110;
            const totalWidth = imgWidth + (paddingSide * 2);
            const totalHeight = (paddingSide * 2) + (imgHeight * 4) + (gapSpacing * 3) + layoutFooterZoneHeight;

            canvasCompiler.width = totalWidth; canvasCompiler.height = totalHeight;
            const ctx = canvasCompiler.getContext('2d');

            // Set off-white analog card stock paper base
            ctx.fillStyle = '#f6f5f2';
            ctx.fillRect(0, 0, totalWidth, totalHeight);

            // Compute math modifiers for film styles
            const grainWeight = grainSelect.value === 'light' ? 8 : (grainSelect.value === 'medium' ? 16 : 28);
            const useFilter = filterSelect.value;
            const useLeak = leakSelect.value;

            memoryCacheFrames.forEach((cachedCanvas, index) => {
                const targetX = paddingSide;
                const targetY = paddingSide + (index * (imgHeight + gapSpacing));

                const procCanvas = document.createElement('canvas');
                procCanvas.width = imgWidth; procCanvas.height = imgHeight;
                const pCtx = procCanvas.getContext('2d');
                pCtx.drawImage(cachedCanvas, 0, 0, imgWidth, imgHeight);

                const dataPayload = pCtx.getImageData(0, 0, imgWidth, imgHeight);
                const pixelArray = dataPayload.data;

                // 1. Process Base Photographic Emulsion Filter Textures
                for (let i = 0; i < pixelArray.length; i += 4) {
                    let r = pixelArray[i]; let g = pixelArray[i+1]; let b = pixelArray[i+2];

                    if (useFilter === 'bw') {
                        // High silver contrast black and white mapping
                        let val = 0.299 * r + 0.587 * g + 0.114 * b;
                        val = ((val - 128) * 1.25) + 128; // boost contrast curves
                        r = g = b = Math.min(255, Math.max(0, val));
                    } else {
                        // 35mm warm analogue color tone expansion curves
                        r = (r * 1.05) + 10;
                        g = (g * 0.95) + 5;
                        b = (b * 0.85);
                    }

                    // 2. Procedural Film Grain Calculation (Noise injection matrix)
                    let noiseFactor = (Math.random() - 0.5) * grainWeight;
                    pixelArray[i] = Math.min(255, Math.max(0, r + noiseFactor));
                    pixelArray[i+1] = Math.min(255, Math.max(0, g + noiseFactor));
                    pixelArray[i+2] = Math.min(255, Math.max(0, b + noiseFactor));
                }
                pCtx.putImageData(dataPayload, 0, 0);

                // 3. Vintage Camera Light Leak Simulation Layer Overlay
                if (useLeak !== 'none') {
                    // Create an elliptical gradient to simulate light escaping the housing shutter plate
                    let leakRadius = useLeak === 'subtle' ? imgWidth * 0.4 : imgWidth * 0.75;
                    let gradient = pCtx.createRadialGradient(
                        imgWidth, imgHeight * 0.3, 10, 
                        imgWidth, imgHeight * 0.2, leakRadius
                    );
                    
                    // Authentic vintage film burn color codes (High exposure fiery orange fading into amber)
                    gradient.addColorStop(0, 'rgba(255, 69, 0, 0.85)');   // Pure Red-Orange burn center
                    gradient.addColorStop(0.3, 'rgba(255, 140, 0, 0.5)'); // Golden amber mid-tone
                    gradient.addColorStop(0.7, 'rgba(255, 165, 0, 0.15)'); // Soft edge yellow wash
                    gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');   // Clean alpha exit
                    
                    pCtx.globalCompositeOperation = 'screen'; // Simulates real exposure lighting build up
                    pCtx.fillStyle = gradient;
                    pCtx.fillRect(0, 0, imgWidth, imgHeight);
                    pCtx.globalCompositeOperation = 'source-over'; // Reset layer stack pipeline
                }

                // Render finalized treated asset onto master layout strip
                ctx.drawImage(procCanvas, targetX, targetY);
                ctx.strokeStyle = 'rgba(0,0,0,0.08)';
                ctx.lineWidth = 2;
                ctx.strokeRect(targetX, targetY, imgWidth, imgHeight);
            });

            // Draw typographic souvenir card footer elements
            ctx.fillStyle = '#222222';
            ctx.font = "bold 24px 'Courier New', monospace";
            ctx.textAlign = 'center';
            ctx.fillText(`✨ ${textInput.value.toUpperCase()} ✨`, totalWidth / 2, totalHeight - 60);
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.font = "14px 'Courier New', monospace";
            ctx.fillText(`EST. ${new Date().getFullYear()} // PHOTOMATON SYSTEM`, totalWidth / 2, totalHeight - 35);

            // Execute instantaneous file downloading action
            const dlLink = document.createElement('a');
            dlLink.download = `vintage-booth-${Date.now()}.jpg`;
            dlLink.href = canvasCompiler.toDataURL('image/jpeg', 0.95);
            dlLink.click();
        }

        triggerBtn.addEventListener('click', runAutomationCaptureSequence);
        exportBtn.addEventListener('click', compileHighResBitmapDownload);
        window.addEventListener('load', () => { startCameraHardwareFeed(); structuralLayoutBlueprintRefresh(); });
    </script>
</body>
</html>
